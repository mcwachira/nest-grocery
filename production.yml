name: nest-grocery-ecommerce-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ecommerce]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ecommerce]

  api:
    image: ${REGISTRY:-ghcr.io/yourorg}/ecommerce-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ecommerce]
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  storefront:
    image: ${REGISTRY:-ghcr.io/yourorg}/ecommerce-storefront:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      NODE_ENV: production
    depends_on: [api]
    networks: [ecommerce]

  admin:
    image: ${REGISTRY:-ghcr.io/yourorg}/ecommerce-admin:${IMAGE_TAG:-latest}
    restart: always
    depends_on: [api]
    networks: [ecommerce]

  blog:
    image: ${REGISTRY:-ghcr.io/yourorg}/ecommerce-blog:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      NODE_ENV: production
    depends_on: [api]
    networks: [ecommerce]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [storefront, admin, blog, api]
    networks: [ecommerce]

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

networks:
  ecommerce:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_www: