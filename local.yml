name: nest-grocery-ecommerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: nestp-grocery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ ecommerce ]

  redis:
    image: redis:7-alpine
    container_name: nest-grocery-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ ecommerce ]

  mailhog:
    image: mailhog/mailhog
    container_name: nest-grocery-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI, view "sent" order emails here
      - "1025:1025" # smtp
    networks: [ ecommerce ]


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: nest-grocery-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ ecommerce ]


  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      target: dev
    container_name: ecommerce-storefront
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/storefront/node_modules
      - /app/apps/storefront/.next
    ports:
      - "3000:3000"
    depends_on: [ api ]
    networks: [ ecommerce ]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: dev
    container_name: ecommerce-admin
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: http://localhost/api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
    ports:
      - "5173:5173"
    depends_on: [ api ]
    networks: [ ecommerce ]


  blog:
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
      target: dev
    container_name: ecommerce-blog
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/blog/node_modules
    ports:
      - "3002:3000"
    depends_on: [ api ]
    networks: [ ecommerce ]

  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on: [ storefront, admin, blog, api ]
    networks: [ ecommerce ]

networks:
  ecommerce:
    driver: bridge

volumes:
  postgres_data:
  redis_data: