# .github/workflows/deploy.yml
# On push to main (or a v* tag), builds & pushes all 4 images to GHCR,
# then SSHes into the production server and re-pulls/restarts the stack.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   PROD_HOST     - server IP or hostname
#   PROD_USER     - SSH user
#   PROD_SSH_KEY  - private key with access to that server
# GITHUB_TOKEN is provided automatically, no setup needed.
#
# On the server itself, /opt/nest-grocery must be a checkout of this repo
# with a .env.production file containing the values docker-compose.prod.yml
# expects (POSTGRES_*, REDIS_PASSWORD, REGISTRY, etc).

name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

# Only one deploy at a time; don't cancel one mid-flight
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR
    strategy:
      matrix:
        app: [api, storefront, admin, blog]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/nest-grocery-${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Simple single-VM deploy over SSH. If you're deploying to
      # Kubernetes / Fly / Render / ECS instead, swap this step for the
      # appropriate deploy action — the build-and-push job above still
      # applies either way.
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/nest-grocery
            git pull origin main
            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f