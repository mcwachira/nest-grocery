# docker-compose.yml
# Local development stack for nest-grocery.
# Run with:  docker compose up --build
#
# Every app container mounts the whole repo as a volume so you get hot
# reload, and each service's own node_modules is mounted separately so
# it doesn't get shadowed by your host's node_modules (or lack thereof).

name: nest-grocery-dev

services:
  # ---------------------------------------------------------------------
  # Postgres — primary datastore (orders, products, users, inventory...)
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nest-grocery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nest_grocery}
    ports:
      - "5433:5432" # exposed to host so you can connect with a GUI client
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # Redis — cart/session cache, rate limiting, job queues (e.g. BullMQ)
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nest-grocery-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # Mailhog — catches outgoing email locally (order confirmations, etc.)
  # View sent mail at http://localhost:8025
  # ---------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog
    container_name: nest-grocery-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP port your API sends mail to
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # api — NestJS backend
  # ---------------------------------------------------------------------
  api:
    build:
      context: .                       # repo root, required for turbo prune
      dockerfile: apps/api/Dockerfile
      target: dev                      # use the "dev" build stage (hot reload)
    container_name: nest-grocery-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nest_grocery}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      NODE_ENV: development
    volumes:
      - .:/app                          # full repo, for hot reload
      - /app/node_modules                # anonymous volumes so container's
      - /app/apps/api/node_modules       # own node_modules win over host mount
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # storefront — Next.js customer-facing shop
  # ---------------------------------------------------------------------
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      target: dev
    container_name: nest-grocery-storefront
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/storefront/node_modules
      - /app/apps/storefront/.next        # keep the build cache in-container
    ports:
      - "3000:3000"
    depends_on: [api]
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # admin — Vite SPA, internal dashboard
  # ---------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: dev
    container_name: nest-grocery-admin
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: http://localhost/api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
    ports:
      - "5173:5173"
    depends_on: [api]
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # blog — Remix (Vite) content site
  # ---------------------------------------------------------------------
  blog:
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
      target: dev
    container_name: nest-grocery-blog
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/blog/node_modules
    ports:
      - "3002:5173" # host 3002 -> container 3000, avoids clashing with storefront
    depends_on: [api]
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # nginx — single entrypoint on :80, path-routes to each app
  # /            -> storefront
  # /admin/*     -> admin
  # /blog/*      -> blog
  # /api/*       -> api
  # ---------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nest-grocery-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on: [storefront, admin, blog, api]
    networks: [nest-grocery]

networks:
  nest-grocery:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
