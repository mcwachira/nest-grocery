# docker/nginx/spa.conf
# Baked into apps/admin's own Docker image (see apps/admin/Dockerfile's
# "runner" stage). Handles client-side routing: any path that isn't a
# real file falls back to index.html so React Router can take over.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
