# Rate-limit the API to slow down cart/checkout abuse and bots
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: only serves the ACME challenge, everything else redirects to HTTPS
server {
    listen 80;
    server_name storefront.example.com admin.example.com blog.example.com api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name storefront.example.com;

    ssl_certificate     /etc/nginx/certs/live/storefront.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/storefront.example.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/admin.example.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    # Consider adding an IP allowlist or basic auth here for the admin panel
    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl http2;
    server_name blog.example.com;

    ssl_certificate     /etc/nginx/certs/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/blog.example.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://blog:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.example.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 20M;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe/payment webhooks often need the raw body and no buffering
    location /webhooks/ {
        proxy_pass http://api:4000/webhooks/;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }
}