# docker/nginx/prod.conf
# Production reverse proxy: TLS termination + subdomain routing.
# Replace *.example.com below with your real domains before deploying,
# and update docker-compose.prod.yml cert volume paths to match.
#
# Subdomain layout (cleaner cookies/CORS for checkout flows than paths):
#   storefront.example.com -> storefront
#   admin.example.com      -> admin
#   blog.example.com       -> blog
#   api.example.com        -> api

# Rate-limit the API — slows down cart/checkout abuse and scraping bots
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: only serves Let's Encrypt's ACME challenge, everything
# else gets redirected to HTTPS
server {
    listen 80;
    server_name storefront.example.com admin.example.com blog.example.com api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- storefront (customer-facing shop) --------------------------------
server {
    listen 443 ssl http2;
    server_name storefront.example.com;

    ssl_certificate     /etc/nginx/certs/live/storefront.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/storefront.example.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        proxy_pass http://storefront:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- admin (internal dashboard) ----------------------------------------
server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/admin.example.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    # Consider adding an IP allowlist or HTTP basic auth here, e.g.:
    #   allow 203.0.113.0/24;
    #   deny all;
    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ---- blog ----------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name blog.example.com;

    ssl_certificate     /etc/nginx/certs/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/blog.example.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://blog:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ---- api -------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.example.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 20M; # product image / bulk CSV uploads

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment provider webhooks (e.g. Stripe/M-Pesa) often need the raw,
    # unbuffered request body for signature verification
    location /webhooks/ {
        proxy_pass http://api:4000/webhooks/;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }
}
