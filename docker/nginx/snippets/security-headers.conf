# docker/nginx/snippets/security-headers.conf
# Included by each server block in prod.conf via: include /etc/nginx/snippets/security-headers.conf;

add_header X-Frame-Options "SAMEORIGIN" always;              # prevent clickjacking
add_header X-Content-Type-Options "nosniff" always;           # stop MIME sniffing
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
