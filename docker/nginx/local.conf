# docker/nginx/local.conf
# Local dev reverse proxy. Single entrypoint on http://localhost
# Path-based routing (simplest for local dev, no /etc/hosts editing needed):
#   /api/*   -> api      (NestJS,   container port 4000)
#   /admin/* -> admin    (Vite,     container port 5173)
#   /blog/*  -> blog     (Remix,    container port 3002->3000)
#   /*       -> storefront (Next.js, container port 3000) — catch-all

upstream storefront_upstream { server storefront:3000; }
upstream admin_upstream     { server admin:5173; }
upstream blog_upstream      { server blog:3002; }
upstream api_upstream       { server api:4000; }

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M; # allow product image uploads etc.

    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # needed if you add
        proxy_set_header Connection "upgrade";        # websockets later
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://admin_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # needed for Vite HMR
        proxy_set_header Connection "upgrade";         # websocket
        proxy_set_header Host $host;
    }

    location /blog/ {
        proxy_pass http://blog_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Storefront is the root app — catches everything not matched above
    location / {
        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # needed for Next.js
        proxy_set_header Connection "upgrade";         # fast refresh (HMR)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
