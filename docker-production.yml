# docker-compose.prod.yml
# Production stack for nest-grocery. Unlike docker-compose.yml, this pulls
# pre-built images from a registry (built by .github/workflows/deploy.yml)
# instead of building from source on the server.
#
# Run with:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (put these in .env.production on the server):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   REDIS_PASSWORD
#   REGISTRY (e.g. ghcr.io/your-github-username)
#   IMAGE_TAG (e.g. latest, or sha-<commit>)

name: nest-grocery-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nest-grocery]
    # NOTE: not exposing 5432 to the host here on purpose — only the
    # api container can reach it, over the internal network.

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nest-grocery]

  api:
    image: ${REGISTRY:-ghcr.io/yourorg}/nest-grocery-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nest-grocery]
    deploy:
      replicas: 2                 # simple horizontal scaling for the API
      resources:
        limits:
          memory: 512M

  storefront:
    image: ${REGISTRY:-ghcr.io/yourorg}/nest-grocery-storefront:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      NODE_ENV: production
    depends_on: [api]
    networks: [nest-grocery]

  admin:
    image: ${REGISTRY:-ghcr.io/yourorg}/nest-grocery-admin:${IMAGE_TAG:-latest}
    restart: always
    depends_on: [api]
    networks: [nest-grocery]

  blog:
    image: ${REGISTRY:-ghcr.io/yourorg}/nest-grocery-blog:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      NODE_ENV: production
    depends_on: [api]
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # nginx — TLS termination + subdomain routing + rate limiting
  # ---------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [storefront, admin, blog, api]
    networks: [nest-grocery]

  # ---------------------------------------------------------------------
  # certbot — renews Let's Encrypt certs every 12h in the background
  # ---------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    volumes:
      - ./docker/nginx/certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

networks:
  nest-grocery:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_www:
